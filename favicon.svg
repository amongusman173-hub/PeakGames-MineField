<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Fuse wire -->
  <path d="M38 20 Q44 13 48 9" fill="none" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fuse spark glow -->
  <circle cx="48.5" cy="8.5" r="5" fill="#f5c842" opacity="0.25"/>
  <circle cx="48.5" cy="8.5" r="3" fill="#f5c842" opacity="0.6"/>
  <circle cx="48.5" cy="8.5" r="1.5" fill="#fff" opacity="0.9"/>

  <!-- Spikes — 8 directions -->
  <g stroke="#c8cfe0" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="16" x2="32" y2="11"/>
    <line x1="32" y1="52" x2="32" y2="57"/>
    <line x1="10" y1="34" x2="5"  y2="34"/>
    <line x1="54" y1="34" x2="59" y2="34"/>
    <line x1="17.5" y1="21.5" x2="13.5" y2="17.5"/>
    <line x1="46.5" y1="21.5" x2="50.5" y2="17.5"/>
    <line x1="17.5" y1="46.5" x2="13.5" y2="50.5"/>
    <line x1="46.5" y1="46.5" x2="50.5" y2="50.5"/>
  </g>

  <!-- Spike end dots -->
  <g fill="#c8cfe0">
    <circle cx="32" cy="10"  r="2.2"/>
    <circle cx="32" cy="58"  r="2.2"/>
    <circle cx="4"  cy="34"  r="2.2"/>
    <circle cx="60" cy="34"  r="2.2"/>
    <circle cx="12" cy="16"  r="2.2"/>
    <circle cx="52" cy="16"  r="2.2"/>
    <circle cx="12" cy="52"  r="2.2"/>
    <circle cx="52" cy="52"  r="2.2"/>
  </g>

  <!-- Mine body shadow/depth -->
  <circle cx="33" cy="35.5" r="17" fill="black" opacity="0.3"/>

  <!-- Mine body gradient -->
  <defs>
    <radialGradient id="mineGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#3a3f55"/>
      <stop offset="55%"  stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0d1018"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="34" r="17" fill="url(#mineGrad)"/>

  <!-- Mine body outline -->
  <circle cx="32" cy="34" r="17" fill="none" stroke="#e94560" stroke-width="2"/>

  <!-- Shine highlight -->
  <ellipse cx="26.5" cy="27.5" rx="5" ry="3.5" fill="white" opacity="0.15" transform="rotate(-30 26.5 27.5)"/>
  <ellipse cx="25"   cy="26"   rx="2.5" ry="1.5" fill="white" opacity="0.25" transform="rotate(-30 25 26)"/>

  <!-- Inner band ring -->
  <circle cx="32" cy="34" r="11" fill="none" stroke="#e94560" stroke-width="1" opacity="0.35"/>

  <!-- Bolt / screw details -->
  <circle cx="32" cy="23" r="2" fill="#e94560" opacity="0.7"/>
  <circle cx="32" cy="45" r="2" fill="#e94560" opacity="0.7"/>
  <circle cx="21" cy="34" r="2" fill="#e94560" opacity="0.7"/>
  <circle cx="43" cy="34" r="2" fill="#e94560" opacity="0.7"/>

  <!-- Center glow dot -->
  <circle cx="32" cy="34" r="4" fill="#4ecca3" opacity="0.15"/>
  <circle cx="32" cy="34" r="2" fill="#4ecca3" opacity="0.6"/>

</svg>
